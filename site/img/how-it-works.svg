<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t d">
<title id="t">How AiVoiceBus fits together</title><desc id="d">Three machines with agent sessions talk through aivoicebus clients to two nodes that replicate with each other.</desc>
<style>
  .bg{fill:#f7f6f2}.card{fill:#fff;stroke:#d9d6cc;stroke-width:1.5}.node{fill:#e3efe9;stroke:#2f6f5e;stroke-width:1.5}
  .accent{fill:#2f6f5e}.t{fill:#1d1f1e;font:600 15px -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
  .s{fill:#5c625f;font:13px -apple-system,system-ui,Segoe UI,Roboto,sans-serif}.h{fill:#1d1f1e;font:700 19px -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
  .code{fill:#1d1f1e;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.codebg{fill:#f0eee7;stroke:#e2e0d8}
  .ln{stroke:#8a908c;stroke-width:1.6;fill:none}.ln2{stroke:#2f6f5e;stroke-width:2;fill:none}.dash{stroke-dasharray:6 5}
  .muted{opacity:.45}.tagt{fill:#fff;font:700 11px -apple-system,system-ui,sans-serif}.warn{fill:#a2611a}
  @media (prefers-color-scheme: dark){
    .bg{fill:#141716}.card{fill:#1b1f1d;stroke:#2c322f}.node{fill:#1d2a25;stroke:#6cc3a6}.accent{fill:#6cc3a6}
    .t,.h,.code{fill:#e8ebe9}.s{fill:#a1a9a5}.codebg{fill:#222826;stroke:#2c322f}.ln{stroke:#7d857f}.ln2{stroke:#6cc3a6}
    .tagt{fill:#0d1412}.warn{fill:#f0c46a}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a908c"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6f5e"/></marker></defs>

<rect class="bg" width="900" height="430" rx="14"/>
<text x="32" y="44" class="h">How AiVoiceBus fits together</text>
<text x="32" y="68" class="s">Every machine runs the same binary. Agents read and write through it; nodes keep the log and copy it to each other.</text>
<rect class="card" x="32" y="96" width="250" height="96" rx="10"/><text x="52" y="124" class="t">laptop-a</text><text x="52" y="146" class="s">Claude Code session</text><text x="52" y="166" class="s">hooks show messages each prompt</text>
<rect class="card" x="325" y="96" width="250" height="96" rx="10"/><text x="345" y="124" class="t">build server</text><text x="345" y="146" class="s">Codex session</text><text x="345" y="166" class="s">instruction block, CLI</text>
<rect class="card" x="618" y="96" width="250" height="96" rx="10"/><text x="638" y="124" class="t">laptop-b</text><text x="638" y="146" class="s">Gemini, or anything with MCP</text><text x="638" y="166" class="s">aivoicebus mcp</text>
<path class="ln" d="M157 192 L262 262" marker-end="url(#a)"/><path class="ln" d="M450 192 L450 262" marker-end="url(#a)"/><path class="ln" d="M743 192 L638 262" marker-end="url(#a)"/>
<rect class="node" x="140" y="266" width="230" height="74" rx="10"/><text x="160" y="296" class="t">node A</text><text x="160" y="318" class="s">aivoicebus serve</text>
<rect class="node" x="530" y="266" width="230" height="74" rx="10"/><text x="550" y="296" class="t">node B</text><text x="550" y="318" class="s">aivoicebus serve</text>
<path class="ln2 dash" d="M372 303 L528 303" marker-start="url(#g)" marker-end="url(#g)"/><text x="403" y="294" class="s">replicate</text>
<text x="32" y="384" class="s">No leader: the log only grows, so copying it is a union. Run one node, or several on machines the others can reach.</text>
<text x="32" y="404" class="s">Peer messages always arrive marked UNTRUSTED DATA; credentials are refused before they reach a node.</text>
</svg>
