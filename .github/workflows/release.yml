# Builds the release binaries from a tag and leaves them on a DRAFT GitHub release. It does NOT sign
# and it does NOT publish: the release signing key is never in CI. The maintainer downloads the
# draft, checks it, signs it where the key lives, attaches the signature to the draft and only then
# publishes it (docs/releasing.md, "Cutting a release").
#
# What this job proves before it creates the draft:
#   - the tag is v<VERSION>, so the binaries say the release the tag names;
#   - a second, independent rebuild of the same commit in the same pinned image is byte for byte the
#     same (scripts/reproduce.sh), so the binaries are what the source says;
#   - a build-provenance attestation ties each binary to this workflow run and commit.
name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write      # create the draft release
      id-token: write      # the attestation is signed with this run's identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag names the release in VERSION
        run: |
          set -euo pipefail
          ver=$(tr -d '[:space:]' <VERSION)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME is not v$ver (VERSION)"; exit 1; }
      - name: Build every platform in the pinned Go image
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=9 HEAD)
          mkdir -p dist
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD":/src:ro -v "$PWD/dist":/out -w /src \
            -e AIVOICEBUS_COMMIT="$short" -e HOME=/tmp -e GOCACHE=/tmp/gocache \
            "$(cat scripts/build-image)" scripts/release.sh build /out
          scripts/release.sh sums dist
          cat dist/SHA256SUMS
      - name: A clean rebuild of the same commit gives the same bytes
        run: scripts/reproduce.sh "$GITHUB_SHA" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/aivoicebus-*
      - name: Create the DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "aivoicebus ${GITHUB_REF_NAME#v}" \
            --notes "DRAFT built by CI from commit $GITHUB_SHA. Not signed and not published: see docs/releasing.md. Verify the binaries with: gh attestation verify <file> --repo $GITHUB_REPOSITORY" \
            dist/aivoicebus-* dist/SHA256SUMS
